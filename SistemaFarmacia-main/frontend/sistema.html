<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Farmácia Couto — Gestão Inteligente</title>
  
  <!-- Tipografia Moderna (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Estilos Modulares do Design System -->
  <link rel="stylesheet" href="/src/css/variables.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/dashboard.css" />
</head>
<body class="carregando">
  <div class="app-container">
    
    <!-- SIDEBAR LATERAL ESQUERDA (ESTILO DONEZO) -->
    <aside class="sidebar">
      <!-- Marca / Logo -->
      <a href="#" class="sidebar-brand" data-route="dashboard">
        <div class="brand-icon">
          <!-- Ícone Geométrico estilo Donezo -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v10M7 12h10"/>
          </svg>
        </div>
        <span class="brand-title">Farmácia Couto</span>
      </a>

      <!-- Menu Principal -->
      <div class="sidebar-section-title" id="tituloMenu">MENU</div>
      <ul class="nav-menu">
        <li class="nav-item active" data-route="dashboard">
          <a class="nav-link">
            <div class="nav-link-content">
              <!-- Ícone Grid / Dashboard -->
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
              </svg>
              <span>Dashboard</span>
            </div>
          </a>
        </li>

        <li class="nav-item" data-route="clientes">
          <a class="nav-link">
            <div class="nav-link-content">
              <!-- Ícone Clientes / Pessoas -->
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              <span>Clientes</span>
            </div>
            <span class="nav-badge">Novo</span>
          </a>
        </li>

        <li class="nav-item" data-route="manipulacoes">
          <a class="nav-link">
            <div class="nav-link-content">
              <!-- Ícone Frasco / Manipulação -->
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 2v4M14 2v4M8 6h8M6 10h12l-2 11H8L6 10z"/>
              </svg>
              <span>Manipulação</span>
            </div>
          </a>
        </li>

        <li class="nav-item" data-route="exames">
          <a class="nav-link">
            <div class="nav-link-content">
              <!-- Ícone Atividade / Exames -->
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
              </svg>
              <span>Exames</span>
            </div>
          </a>
        </li>

        <li class="nav-item" data-route="receitas">
          <a class="nav-link">
            <div class="nav-link-content">
              <!-- Ícone Documento / Receitas -->
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              <span>Receitas</span>
            </div>
          </a>
        </li>
      </ul>

      <!-- Seção Geral -->
      <div class="sidebar-section-title" id="tituloGeral">GERAL</div>
      <ul class="nav-menu">
        <li class="nav-item" data-route="configuracoes">
          <a class="nav-link">
            <div class="nav-link-content">
              <!-- Ícone Engrenagem -->
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              <span>Configurações</span>
            </div>
          </a>
        </li>
      </ul>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-wrapper">
      
      <!-- TOPBAR SUPERIOR FLUTUANTE -->
      <header class="topbar">
        <!-- Campo de Busca Estilo Pill -->
        <div class="search-pill-container">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" class="search-pill" id="globalSearchInput" placeholder="Buscar por paciente, CPF, receita ou fórmula..." />
          <span class="search-kbd">⌘F</span>
        </div>

        <!-- Ações do Topbar & Perfil -->
        <div class="topbar-actions">
          <!-- Botão Mensagens -->
          <button class="icon-btn-pill" title="Mensagens e Alertas">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </button>

          <!-- Botão Notificações com Badge -->
          <button class="icon-btn-pill" title="Notificações">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="badge-dot"></span>
          </button>

          <!-- Aviso de modo demonstração (sem API configurada) -->
          <span class="badge badge-warning" id="badgeModoDemo" style="display: none;" title="Dados fictícios guardados apenas neste navegador">Modo demonstração</span>

          <!-- Perfil do Usuário com Avatar -->
          <div class="user-profile-badge" id="userProfileBadge">
            <div class="user-avatar">👨🏻‍⚕️</div>
            <div class="user-info">
              <span class="user-name" id="userNameText"></span>
              <span class="user-role" id="userRoleText"></span>
            </div>
          </div>

          <button type="button" class="btn btn-secondary btn-sm" id="btnSair" title="Encerrar a sessão">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sair
          </button>
        </div>
      </header>

      <!-- CABEÇALHO DINÂMICO DA PÁGINA -->
      <section class="page-header" style="background: transparent; padding: 0;">
        <div class="page-title-group">
          <h1 id="pageTitleText">Dashboard</h1>
          <p id="pageSubtitleText">Acompanhe métricas, atendimentos e desempenho em tempo real.</p>
        </div>

        <div class="page-actions">
          <button class="btn btn-secondary" onclick="alert('Exportando relatório consolidado...')">
            Exportar Relatório
          </button>
          <button class="btn btn-primary" id="btnNovoAtendimento" onclick="window.appRouter.navigate('clientes')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Novo Atendimento
          </button>
        </div>
      </section>

      <!-- CONTAINER DINÂMICO ONDE AS TELAS SÃO RENDERIZADAS -->
      <div id="mainContentArea"></div>

    </main>

  </div>

  <!-- Script Principal Modular -->
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
